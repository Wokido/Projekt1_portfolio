<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild- och videoövning</title>
    <style>

        header{
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;

        }

        h1{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            align-content: center;
            justify-content: center;
            contain: content;
        }

        img {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 10px;
            margin: 10px;

        }

        .ex1 {
            width: 30px;
            height: 30px;
            display: block;
        }

        section { 
            align-items: center;
            align-content: center;
        }

        .logo {
            border-radius: 50%;
            max-width: 150px;
        }

        .inline {
            max-width: 200px;
            border: 2px solid #333;
            filter: grayscale(50%);
            vertical-align: middle;

        }

        .default {
            max-width: 250px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }


        main {
            display: block  ;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        iframe {
            max-width: 560px;
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            border-radius: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <img class ="logo" src="Images/autologo-logo.svg" alt="Logotyp">
        <h1>Bilder och filmer om oss</h1>
        <img class ="logo" src="Images/autologo-logo.svg" alt="Logotyp">
     </header>
    <main>
        <a 
            href="https://sv.wikipedia.org/wiki/Steamboat_ladies"target=blank>        
            <img class="ex1" src="Images/icon_helpfill-inline-image.svg" alt="Extra bild 1" class="default">
        </a>
    

    
        <img class ="default" src="Images/girl_coder.webp" alt="Default-bild">
        <section>
            <p>ful <img class ="inline" src="Images/car.webp" alt="Inline-bild">DETTA ÄR Bil
            </p>

        </section>
   

        <img src="Images/web-default-image.jpg" alt="Extra bild 2" class="default">

        <iframe 
            width="560" height="315" 
            src="https://www.youtube.com/embed/vBGahkJX0kc?si=bBuCl2hvdohWcpK6" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
        </iframe>

    </main>
</body>
</html>
